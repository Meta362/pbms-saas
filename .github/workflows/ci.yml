name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'master'
      - 'feat/*'
      - 'fix/*'
      - 'task-ready'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pbms_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django Checks
        env:
          DJANGO_SECRET_KEY: ci-only-django-secret-key-that-is-long-enough-and-secure-12345
          JWT_SIGNING_KEY: ci-only-jwt-signing-key-distinct-from-django-secret-key-12345
          SUPERADMIN_LICENSE_SIGNING_KEY: ci-only-superadmin-license-key-distinct-from-secrets-98765
          DJANGO_ALLOWED_HOSTS: pbms.example.com
          DJANGO_DEBUG: False
          DJANGO_SECURE_SSL_REDIRECT: False
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: pbms_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          python manage.py check

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: ci-only-django-secret-key-that-is-long-enough-and-secure-12345
          JWT_SIGNING_KEY: ci-only-jwt-signing-key-distinct-from-django-secret-key-12345
          SUPERADMIN_LICENSE_SIGNING_KEY: ci-only-superadmin-license-key-distinct-from-secrets-98765
          DJANGO_ALLOWED_HOSTS: pbms.example.com
          DJANGO_DEBUG: False
          DJANGO_SECURE_SSL_REDIRECT: False
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: pbms_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          python manage.py test apps.core apps.accounts apps.subscriptions apps.operations apps.tenants -v 2

  frontend-tests:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test

      - name: Build All Frontends
        run: |
          cd frontend
          npm run build:all

      - name: Verify Raw Build Fails Release Contract (Negative Gate)
        run: |
          cd frontend
          echo "Verifying that raw production builds fail validation when dev configs are present..."
          if npm run validate:release; then
            echo "CRITICAL ERROR: validate:release passed on raw build containing development config!"
            exit 1
          fi
          echo "Verified: Raw production build failed closed as expected."

      - name: Generate Production Runtime Config
        run: |
          cd frontend
          # Generates safe, verified production configuration
          npm run generate:release-config

      - name: Validate Release Artifacts Contract (Positive Gate)
        run: |
          cd frontend
          npm run validate:release
