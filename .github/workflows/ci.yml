name: CI

on:
  pull_request:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'task-ready'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pbms_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django Checks
        env:
          DJANGO_SECRET_KEY: ci-only-django-secret-key-12345
          DJANGO_DEBUG: False
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: pbms_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          python manage.py check

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: ci-only-django-secret-key-12345
          DJANGO_DEBUG: False
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: pbms_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          python manage.py test apps.core apps.accounts apps.subscriptions apps.operations -v 2

  frontend-tests:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test

      - name: Build All Frontends
        run: |
          cd frontend
          npm run build:all
